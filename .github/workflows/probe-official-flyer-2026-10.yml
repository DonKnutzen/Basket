name: Probe official Kiel flyer URLs (temporary)
on:
  push:
    branches: [feature/rewe-aldi-offers-and-readable-ocr-2026-10]
    paths: [.github/workflows/probe-official-flyer-2026-10.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check publicly accessible official pages and CORS; no stored copies
        shell: bash
        run: |
          set +e
          REWE='https://www.rewe.de/angebote/kiel/561204/rewe-holtenauer-str-69-71/?market-flyer=active'
          ALDI='https://magazine.aldi-nord.de/aldi-nord/aldi-aktuell/2026/2026cw44mopromotionaldi-angebote-ab-montag-26-10-1//GetPDF.ashx'
          ALDI_HTML='https://www.aldi-nord.de/angebote.html'
          for NAME in REWE ALDI ALDI_HTML; do
            eval "URL=\$$NAME"
            echo "=== $NAME official URL ==="
            curl -L -I -m 25 -sS -H 'Origin: https://donknutzen.github.io' "$URL" | grep -Ei '^HTTP/|^content-type:|^content-length:|^access-control-allow-origin:|^location:|^x-robots-tag:' | tail -15 || true
            curl -L -m 25 -sS -o "/tmp/$NAME" -w "GET status=%{http_code} bytes=%{size_download} type=%{content_type} final=%{url_effective}\n" "$URL" || true
            if [[ "$NAME" == "ALDI" ]]; then
              if head -c 4 "/tmp/$NAME" | grep -q '%PDF'; then
                echo 'ALDI PDF magic confirmed'
                pdfinfo "/tmp/$NAME" | grep -E '^Pages:|^Page size:|^File size:' | head -3
                pdftotext -f 1 -l 2 -layout "/tmp/$NAME" /tmp/aldi-extract.txt || true
                python -m pip install -q pypdf
                python -c 'from pypdf import PdfReader; r=PdfReader("/tmp/ALDI",strict=False); print("PYPDF pages=",len(r.pages)); [print("PYPDF PAGE",i+1,"TEXT:",(r.pages[i].extract_text() or "")[:1400]) for i in range(min(2,len(r.pages)))]' || true

                echo 'PDF TEXT EXTRACT stats:'; wc -lc /tmp/aldi-extract.txt || true
                echo 'SAMPLE TEXT (max 25 lines, 125 chars each):'
                head -n 25 /tmp/aldi-extract.txt | cut -c1-125
              else
                echo 'ALDI PDF unavailable; first bytes:'; head -c 100 "/tmp/$NAME" | strings | head -3
              fi
            else
              echo -n 'HTML chars='; wc -c "/tmp/$NAME"
              if grep -q 'Kerrygold' "/tmp/$NAME"; then echo 'Kerrygold appears in raw HTML'; fi
              if grep -q 'Aubergine' "/tmp/$NAME"; then echo 'Aubergine appears in raw HTML'; fi
            fi
          done

name: Offer data source smoke check
on:
  push:
    branches:
      - feature/current-shopping-list-offers-2026-10
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify documented offer interfaces only
        run: node source/scripts/probe-offer-sources.mjs

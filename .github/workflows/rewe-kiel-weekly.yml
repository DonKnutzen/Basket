name: Legacy REWE source diagnostic (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s source/tests -p 'test_rewe_config.py'
      - run: pip install -r source/scripts/flyer_requirements.txt
      # Line-order guesses are diagnostics, never public offer data.
      - run: python source/scripts/extract-rewe-kiel-weekly.py "$RUNNER_TEMP/rewe-diagnostic.json"

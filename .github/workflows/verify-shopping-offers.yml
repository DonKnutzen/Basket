name: Verify on-demand shopping offers
on:
  push:
    branches:
      - feature/current-shopping-list-offers-2026-10
      - feature/local-german-flyer-import-2026-10
      - fix/rewe-flyer-25mb-pdf-2026-10
      - feature/rewe-aldi-offers-and-readable-ocr-2026-10
      - feature/rewe-kiel-publitas-direct-2026w44
      - feature/auto-rewe-aldi-kiel-weekly-2026-10
      - feature/manual-rewe-link-weekly-processing-2026-10
      - fix/ios-auth-session-401-recovery-2026-10-29
      - fix/ios-external-offer-navigation-2026-10
      - feature/kiel-german-offer-access-2026-10
  pull_request:
    branches:
      - main
concurrency:
  group: basket-offers-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install locked dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Validate human-provided REWE market/week links (Python)
        run: python -m unittest discover -s source/tests -p 'test_rewe_config.py'
      - name: Test full app and offers
        working-directory: source
        run: pnpm test
      - name: TypeScript check
        working-directory: source
        run: pnpm exec tsc --noEmit
      - name: Build GitHub Pages app
        working-directory: source
        run: pnpm run build:pages --out ..
      - name: Commit Pages files only to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/ios-auth-session-401-recovery-2026-10-29'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html account-complete.html manifest.webmanifest sw.js .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Basket offer-check Pages [skip ci]"
            git push
          fi

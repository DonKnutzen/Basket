name: Verify central German offers
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/central-kiel-flyer-review]
permissions:
  contents: read
concurrency:
  group: central-offer-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm test && node scripts/test-german-db.mjs && pnpm exec tsc --noEmit && pnpm run build:pages --out ../.ci-pages
        working-directory: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s source/tests -p 'test_*.py'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --no-config --node-modules-dir=none index.ts && deno test --no-config --node-modules-dir=none workload-policy_test.ts
        working-directory: source/supabase/functions/german-flyer-worker
  real-pdf-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native OCR and pinned free PDF parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          pip install -r source/scripts/flyer_requirements.txt
      - name: Verify only the two pinned explicit source fixtures, including all pages
        run: python source/scripts/verify-real-german-pdfs.py --download

name: Central German flyer queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/central-german-flyers.yml
      - source/scripts/german_flyer_layout.py
      - source/scripts/german_flyer_vision.py
      - source/scripts/process-german-flyers.py
      - source/scripts/flyer_requirements.txt
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: central-german-flyer-worker
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free OCR and pinned PDF parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          pip install -r source/scripts/flyer_requirements.txt
      - name: Process queued imports (private data never becomes a workflow artifact)
        env:
          FLYER_WORKER_URL: https://wrmlkpuhyqxkehbvzoxx.supabase.co/functions/v1/german-flyer-worker
          # Explicit opt-in: no calls or charges until the operator enables it.
          FLYER_RECOGNITION: ${{ vars.FLYER_RECOGNITION || 'geometry' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLYER_VISION_MODEL: ${{ vars.FLYER_VISION_MODEL }}
          FLYER_VISION_MAX_CALLS: ${{ vars.FLYER_VISION_MAX_CALLS || '200' }}
        run: python source/scripts/process-german-flyers.py

name: Verify category regression fixes
on:
  push:
    branches:
      - fix/category-regression-tests-2026-10
  pull_request:
    branches:
      - main
concurrency:
  group: category-fix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install exact dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Full regression suite
        working-directory: source
        run: pnpm test
      - name: Typecheck
        working-directory: source
        run: pnpm exec tsc --noEmit
      - name: Build GitHub Pages frontend
        working-directory: source
        run: pnpm run build:pages --out ..
      - name: Commit generated frontend files
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/category-regression-tests-2026-10'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html account-complete.html manifest.webmanifest sw.js .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Basket Pages after category fix [skip ci]"
            git push
          fi

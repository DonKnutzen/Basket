name: One-time inspect public weekly sources
on:
  push:
    branches: [feature/auto-rewe-aldi-kiel-weekly-2026-10]
    paths: [.github/workflows/inspect-weekly-sources-temporary.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only HTML markers, not retailer full data
        shell: bash
        run: |
          python -m pip install -q beautifulsoup4
          python - <<'PY'
          import urllib.request,urllib.error
          from bs4 import BeautifulSoup
          paths=[
           'https://api.publitas.com/v1/groups/89773/publications.json',
           'https://api.publitas.com/v1/groups/89773/publications/rewe_2026_wk44_561204_v1.json',
           'https://view.publitas.com/89773/',
           'https://www.aldi-nord.de/angebote.html',
          ]
          for url in paths:
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BasketSinglePersonalFlyerCheck/1.0'}),timeout=25) as r:
             data=r.read(1000000)
             print('SOURCE',url,'STATUS',r.status,'TYPE',r.headers.get('content-type'),'BYTES_READ',len(data),'ALLOW_ORIGIN',r.headers.get('Access-Control-Allow-Origin'))
            if 'publitas' in url:
             print('PAYLOAD_HEAD',data.decode('utf-8','ignore')[:450])
            else:
             soup=BeautifulSoup(data,'html.parser')
             print('PAGE_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
             for target in ('Aubergine','Bananen','Speisekartoffeln'):
              hits=soup.find_all(string=lambda t: bool(t and target in t),limit=5)
              for h in hits[:2]:
               print('TARGET',target,'PARENT',h.parent.name,'CLASS',h.parent.get('class'),'ANCESTOR_2',h.parent.parent.name,h.parent.parent.get('class') if h.parent.parent else '', 'TEXT',h.parent.parent.get_text(' ',strip=True)[:420])
               for parent in [h.parent.parent.parent, h.parent.parent.parent.parent]:
                if parent:print('CONTAINER',parent.name,parent.get('class'),'TEXT',parent.get_text(' ',strip=True)[:460])
             print('MAIN_HEADING',[(h.name,h.get_text(' ',strip=True)[:90]) for h in soup.select('h2,h3')[:12]])
             html=data.decode('utf-8','ignore')
             print('SCRIPT_COUNT',len(soup.find_all('script')))
             for script in soup.find_all('script'):
              txt=script.string or script.get_text()
              if 'Aubergine' in txt:
               print('SCRIPT TYPE',script.get('type'),'ID',script.get('id'),'LENGTH',len(txt),'START',txt[:170])
               pos=txt.find('Aubergine')
               print('SCRIPT NEAR AUBERGINE',repr(txt[max(0,pos-350):pos+950]))
               break
             import json,collections
             payload=json.loads(soup.select_one('script#__NEXT_DATA__').get_text())
             print('NEXT TOP KEYS',list(payload.keys()))
             print('PAGEPROPS',list(payload.get('props',{}).get('pageProps',{}).keys()))
             records=[]
             def walk(x,path='',depth=0):
              if depth>18:return
              if isinstance(x,dict):
               if isinstance(x.get('currentPrice'),dict) and ('productSlug' in x or 'brandName' in x):
                records.append((path,x))
               for k,v in x.items():walk(v,path+'/'+str(k),depth+1)
              elif isinstance(x,list):
               for i,v in enumerate(x[:300]):walk(v,path+'/'+str(i),depth+1)
             walk(payload)
             props=payload.get('props',{}).get('pageProps',{})
             for key,val in props.items():
              print('PROPS',key,'TYPE',type(val).__name__,'LEN',len(val) if isinstance(val,(str,list,dict)) else -1,'KEYS',list(val)[:20] if isinstance(val,dict) else '','SNIP',str(val)[:170])
             api=props.get('apiData')
             if isinstance(api,dict):
              for k,v in api.items():
               print('API DATA',k,'TYPE',type(v).__name__,'LEN',len(v) if isinstance(v,(str,dict,list)) else -1,'SNIP',str(v)[:110])
             def deepparse(obj,d=0):
              if d>14:return
              if isinstance(obj,str) and len(obj)<2000000 and 'currentPrice' in obj and obj.lstrip().startswith(('{','[')):
               try:walk(json.loads(obj),'parsed',0);return
               except Exception:pass
              if isinstance(obj,dict):
               for val in obj.values():deepparse(val,d+1)
              elif isinstance(obj,list):
               for val in obj[:200]:deepparse(val,d+1)
             deepparse(props)
             print('PARSED PRICE RECORD COUNT',len(records))
             print('PRICE RECORD COUNT',len(records))
             print('PRICE PATHS',collections.Counter('/'.join(p.split('/')[:8]) for p,x in records).most_common(8))
             for path,row in records[:3]:
              print('EXAMPLE',path,'KEYS',list(row.keys()),'PRICE',row.get('currentPrice'),'PROMOS',row.get('promotionPrices'),'NAMEFIELDS',[(k,str(row.get(k))[:100]) for k in ('name','productName','headline','title','brandName','productSlug','productType','shortDescription','category','amount','amountUnit','salesUnit')])
             for path,row in records:
              if 'aubergine' in str(row.get('productSlug','')).lower():
               print('AUBERGINE',path,'FIELDS',[(k,str(v)[:180]) for k,v in row.items() if k not in ('longDescription','richText','content')]);break
             for kw in ('__NEXT_DATA__','_data','application/json','application/ld+json','productPrice','originalPrice','priceValue'):
              print('KEY',kw,html.find(kw))

           except Exception as e:print('ERROR',url,type(e).__name__,str(e)[:230])
          PY

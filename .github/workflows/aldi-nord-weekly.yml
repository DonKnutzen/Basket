name: Legacy ALDI Nord source diagnostic (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Preserve the structured parser; replace public commits with review.
      - run: python source/scripts/extract-aldi-nord-weekly.py "$RUNNER_TEMP/aldi-diagnostic.json"

/* Readable text preferences and a task-focused shopping screen. */
:root{--text-scale:1}
:root[data-text-size="medium"]{--text-scale:1.14}
:root[data-text-size="large"]{--text-scale:1.28}
.list-controls{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e1e8d5;padding:24px 0 16px}
.list-controls .list-tabs{flex:1;min-width:0;margin:0;padding:0;border:0}
.list-controls .new-list-button{flex-shrink:0;min-height:42px;white-space:nowrap}
.connection-warning{font-size:calc(12px * var(--text-scale));color:#9b4e32}
.text-size-settings{border:0;border-top:1px solid #e0ead2;margin:25px 0 0;padding:22px 0 0;min-width:0}
.text-size-settings legend{float:left;width:100%;padding:0;margin-bottom:14px;font-size:calc(16px * var(--text-scale));font-weight:600}
.text-size-options{clear:both;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.text-size-option{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;min-height:83px;padding:12px 5px;border:1px solid #dce5d4;border-radius:10px;background:#fff;color:#486648}
.text-size-option[aria-pressed="true"]{background:#eaf1df;border:2px solid #285640;padding:11px 4px}
.text-size-option:focus-visible{outline:3px solid #d1946a;outline-offset:3px}
.text-size-option>span{font-size:16px;line-height:1.1}
.text-size-option[data-option="medium"]>span{font-size:21px}
.text-size-option[data-option="large"]>span{font-size:27px}
.text-size-option>b{font-size:calc(12px * var(--text-scale));font-weight:500;overflow-wrap:anywhere}
.text-size-settings>p{font-size:calc(12px * var(--text-scale));color:#789562;line-height:1.6;margin-top:12px}

 .topbar{height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;gap:12px}
 .mobile-brand{font-size:24px}

 .top-actions>button:last-child{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center}

 .connection-warning{font-size:calc(11px * var(--text-scale));max-width:120px;line-height:1.35;text-align:right}
 .list-controls{padding-top:18px;padding-bottom:14px;gap:8px}

 .list-controls .list-tabs>button{padding:10px;font-size:calc(13px * var(--text-scale))}

 .shopping-layout{padding-top:18px}
 .section-heading{margin-bottom:16px}

 .section-heading p{font-size:calc(12px * var(--text-scale));line-height:1.6}
 .shopping-aside{display:none}
 .add-item input,.dialog-form input,.dialog-form select,.auth-form input,input,select,textarea{font-size:calc(16px * var(--text-scale))}
 .add-item>input:first-of-type,.add-item input.qty{font-size:calc(16px * var(--text-scale))}

}

/* Make the active sharing scope visible without adding another profile avatar. */
.household-context{padding-top:18px}
.household-context>button{display:flex;align-items:center;gap:8px;max-width:100%;min-height:35px;padding:0;text-align:left;color:#57774e}
.household-context>button>svg{flex-shrink:0}
.household-context>button>span{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.household-context b{font-size:calc(13px * var(--text-scale));font-weight:600;overflow-wrap:anywhere}
.household-context small{font-size:calc(12px * var(--text-scale));color:#738866;overflow-wrap:anywhere}
.household-context+.list-controls{padding-top:10px}
.active-household{display:flex;align-items:flex-start;gap:13px;padding:16px;background:#edf3e5;border-radius:11px;margin-bottom:20px;color:#476e3e}
.active-household>svg{flex-shrink:0;margin-top:3px}
.active-household small{font-size:calc(12px * var(--text-scale));color:#6f865f}
.active-household h3{font-size:calc(18px * var(--text-scale));margin:4px 0 7px;overflow-wrap:anywhere}
.active-household p{font-size:calc(13px * var(--text-scale));line-height:1.5;overflow-wrap:anywhere}
.members-heading{font-size:calc(14px * var(--text-scale));margin:23px 0 12px}
.shared-list-note{display:flex;gap:8px;align-items:flex-start;margin:0}
.shared-list-note>svg{flex-shrink:0;margin-top:2px}
@media(max-width:650px){.household-context{padding-top:8px}.household-context>button{min-height:37px}.household-context+.list-controls{padding-top:4px}.active-household{padding:15px}.active-household h3{font-size:calc(17px * var(--text-scale))}}

/* Receipt camera stays directly beneath the bought items on all screen sizes. */
.list-receipt{margin:24px 0 14px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#f0f4eb;text-align:center}.receipt-camera{position:relative;display:flex;justify-content:center;min-height:48px;width:100%;cursor:pointer}.receipt-camera input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.receipt-camera.disabled{opacity:.5}.list-receipt p{font-size:calc(14px * var(--text-scale,1));line-height:1.5;margin:12px 0 8px}.list-receipt .text-link{margin:auto}.receipt-shopping{background:#f0f4eb;padding:16px;border-radius:12px;margin:16px 0;line-height:1.5}.receipt-shopping label{display:grid;gap:8px;font-weight:600}.receipt-shopping p{font-size:calc(14px * var(--text-scale,1));margin:6px 0 12px}.receipt-shopping select{max-width:100%;min-height:42px}.purchase-type{margin-top:6px;max-width:100%;font-size:calc(13px * var(--text-scale,1));min-height:36px}@media(max-width:700px){.list-receipt{padding:16px;margin-top:18px}}

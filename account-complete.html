/* Readable text preferences and a task-focused shopping screen. */
:root{--text-scale:1}
:root[data-text-size="medium"]{--text-scale:1.14}
:root[data-text-size="large"]{--text-scale:1.28}
.list-controls{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e1e8d5;padding:24px 0 16px}
.list-controls .list-tabs{flex:1;min-width:0;margin:0;padding:0;border:0}
.list-controls .new-list-button{flex-shrink:0;min-height:42px;white-space:nowrap}
.connection-warning{font-size:calc(12px * var(--text-scale));color:#9b4e32}
.text-size-settings{border:0;border-top:1px solid #e0ead2;margin:25px 0 0;padding:22px 0 0;min-width:0}
.text-size-settings legend{float:left;width:100%;padding:0;margin-bottom:14px;font-size:calc(16px * var(--text-scale));font-weight:600}
.text-size-options{clear:both;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.text-size-option{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;min-height:83px;padding:12px 5px;border:1px solid #dce5d4;border-radius:10px;background:#fff;color:#486648}
.text-size-option[aria-pressed="true"]{background:#eaf1df;border:2px solid #285640;padding:11px 4px}
.text-size-option:focus-visible{outline:3px solid #d1946a;outline-offset:3px}
.text-size-option>span{font-size:16px;line-height:1.1}
.text-size-option[data-option="medium"]>span{font-size:21px}
.text-size-option[data-option="large"]>span{font-size:27px}
.text-size-option>b{font-size:calc(12px * var(--text-scale));font-weight:500;overflow-wrap:anywhere}
.text-size-settings>p{font-size:calc(12px * var(--text-scale));color:#789562;line-height:1.6;margin-top:12px}
@media(max-width:650px){
 .topbar{height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;gap:12px}
 .mobile-brand{font-size:24px}
 .mobile-brand>svg{width:22px;height:22px}
 .top-actions>button:last-child{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center}
 .top-actions .avatar{width:31px;height:31px;font-size:calc(12px * var(--text-scale))}
 .connection-warning{font-size:calc(11px * var(--text-scale));max-width:120px;line-height:1.35;text-align:right}
 .list-controls{padding-top:18px;padding-bottom:14px;gap:8px}
 .list-controls .list-tabs{gap:5px}
 .list-controls .list-tabs>button{padding:10px;font-size:calc(13px * var(--text-scale))}
 .list-controls .new-list-button{gap:5px;padding:10px 11px;font-size:calc(13px * var(--text-scale))}
 .shopping-layout{padding-top:18px}
 .section-heading{margin-bottom:16px}
 .section-heading h2{font-size:calc(22px * var(--text-scale));overflow-wrap:anywhere}
 .section-heading p{font-size:calc(12px * var(--text-scale));line-height:1.6}
 .shopping-aside{display:none}
 .add-item input,.dialog-form input,.dialog-form select,.auth-form input,input,select,textarea{font-size:calc(16px * var(--text-scale))}
 .add-item>input:first-of-type,.add-item input.qty{font-size:calc(16px * var(--text-scale))}
 .mobile-nav{height:calc(70px + env(safe-area-inset-bottom))}
 .mobile-nav>button{padding:0 7px;min-width:0;flex:1}
 .mobile-nav .mobile-label{font-size:calc(12px * var(--text-scale))}
}

/* Make the active sharing scope visible without adding another profile avatar. */
.household-context{padding-top:18px}
.household-context>button{display:flex;align-items:center;gap:8px;max-width:100%;min-height:35px;padding:0;text-align:left;color:#57774e}
.household-context>button>svg{flex-shrink:0}
.household-context>button>span{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.household-context b{font-size:calc(13px * var(--text-scale));font-weight:600;overflow-wrap:anywhere}
.household-context small{font-size:calc(12px * var(--text-scale));color:#738866;overflow-wrap:anywhere}
.household-context+.list-controls{padding-top:10px}
.active-household{display:flex;align-items:flex-start;gap:13px;padding:16px;background:#edf3e5;border-radius:11px;margin-bottom:20px;color:#476e3e}
.active-household>svg{flex-shrink:0;margin-top:3px}
.active-household small{font-size:calc(12px * var(--text-scale));color:#6f865f}
.active-household h3{font-size:calc(18px * var(--text-scale));margin:4px 0 7px;overflow-wrap:anywhere}
.active-household p{font-size:calc(13px * var(--text-scale));line-height:1.5;overflow-wrap:anywhere}
.members-heading{font-size:calc(14px * var(--text-scale));margin:23px 0 12px}
.shared-list-note{display:flex;gap:8px;align-items:flex-start;margin:0}
.shared-list-note>svg{flex-shrink:0;margin-top:2px}

.receipt-test-suite{margin:24px 0 6px;padding:18px;border:1px solid #dce6d4;border-radius:12px;background:#f4f7ef;text-align:left}
.receipt-test-suite h3,.receipt-test-results h3{font-size:calc(16px * var(--text-scale));font-weight:650;margin:0 0 7px}

.receipt-test-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}

.receipt-test-modes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.receipt-test-modes button{flex:1;min-width:130px;white-space:normal}

.price-evidence{font-size:.75rem;margin-top:.5rem}.price-evidence label{display:block;margin:.4rem 0}.price-evidence input,.price-evidence select{width:100%;min-width:0}.price-evidence small{display:block;line-height:1.4}.tile-hit small span{display:block;line-height:1.4}


/* Compact per-item weekly offers. No generic retailer-price tables. */
.offer-settings{margin:8px 0 12px;border:1px solid var(--line,#d6ddcf);border-radius:11px;background:var(--surface,#fff);color:var(--ink)}
.offer-settings>summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;padding:10px 12px;font-size:calc(12px * var(--text-scale));font-weight:700}
.offer-settings>summary small{font-size:calc(11px * var(--text-scale));font-weight:400;color:var(--muted)}
.offer-settings-inner{padding:0 12px 12px;font-size:calc(12px * var(--text-scale));line-height:1.45}
.offer-settings-inner p{margin:5px 0 10px;color:var(--muted)}
.offer-region-fields{display:flex;gap:10px;flex-wrap:wrap}
.offer-region-fields label{display:flex;flex-direction:column;gap:4px;font-size:calc(11px * var(--text-scale))}
.offer-region-fields select{border:1px solid var(--line,#d6ddcf);border-radius:7px;background:var(--surface,#fff);color:var(--ink);padding:8px 10px;min-width:105px}
.offer-settings-inner .offer-settings-caption{font-weight:650;color:var(--ink);margin-top:12px}
.offer-store-chips{display:flex;gap:6px;flex-wrap:wrap}
.offer-store-chips button{border:1px solid var(--line,#d6ddcf);border-radius:999px;padding:6px 10px;background:var(--surface,#fff);color:var(--ink);font-size:calc(11px * var(--text-scale))}
.offer-store-chips button.active{border-color:#527b51;background:#e1eddb;color:#244b34;font-weight:700}
.offer-settings-inner .offer-source-note{font-size:calc(11px * var(--text-scale));margin-top:12px}
.tile.with-offer-check:not(.bought) .tile-hit{height:auto;min-height:120px}
.offer-in-tile{padding:0 7px 9px;text-align:left;font-size:calc(11px * var(--text-scale));color:var(--ink);line-height:1.4}
.offer-in-tile>small{display:block;text-align:center;color:var(--muted);margin-top:4px}
.offer-in-tile>strong{font-size:calc(11px * var(--text-scale));display:block;margin-bottom:5px;color:#285640}
.offer-check,.offer-again{background:transparent;border:0;color:#285640;cursor:pointer;font-size:calc(11px * var(--text-scale));padding:4px;text-decoration:underline;text-underline-offset:2px}
.offer-check{display:block;margin:auto;font-weight:700}
.offer-again{display:block;margin:auto}
.offer-hit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;padding:7px 6px;text-decoration:none;color:var(--ink);border:1px solid #ccddc7;border-radius:8px;background:#f3f8ed;margin:5px 0}
.offer-hit>span:first-child{min-width:0;overflow-wrap:anywhere}
.offer-hit>span b{font-size:calc(11px * var(--text-scale))}
.offer-hit>span small{display:block;font-size:calc(10px * var(--text-scale));font-weight:400;line-height:1.35}
.offer-money{text-align:right}
.offer-money b{color:#285640}
.offer-money .offer-was{text-decoration:line-through;color:#7a8273}
.offer-hit .offer-period{grid-column:1/-1;color:#52634f;font-size:calc(10px * var(--text-scale));line-height:1.3}

/* Outbound Kiel flyer links are shown only after the shopper requests them. */
.offer-de-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.offer-de-links a,.offer-de-links button{display:inline-flex;align-items:center;min-height:30px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:calc(11px * var(--text-scale));font-weight:650;text-decoration:none}
.offer-de-links a:focus-visible,.offer-de-links button:focus-visible{outline:2px solid #285640;outline-offset:2px}

/* Keep copied offer links interactive without launching a second iOS PWA window. */
.offer-de-links button{display:inline-flex;align-items:center;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;font-family:inherit;max-width:100%}
.offer-copy-label{display:block;font-size:calc(10px * var(--text-scale));font-weight:400;color:var(--muted);text-align:center}
button.offer-hit{width:100%;font-family:inherit;cursor:pointer;text-align:left}
button.offer-hit .offer-copy-label{grid-column:1/-1}

/* Private local flyer import – compact on mobile, readable at increased text size. */
.flyer-import{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;max-width:100%;overflow-wrap:anywhere}
.flyer-import h3{font-size:calc(15px * var(--text-scale));margin:0 0 6px;color:var(--ink)}
.flyer-import p{font-size:calc(12px * var(--text-scale));line-height:1.5}
.flyer-import-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:10px 0}
.flyer-import-form label,.flyer-file-label,.flyer-review-row label:not(.flyer-check){display:flex;flex-direction:column;gap:5px;font-size:calc(11px * var(--text-scale));font-weight:650}
.flyer-import select,.flyer-import input[type=date],.flyer-import input[type=text],.flyer-review-row input:not([type=checkbox]){
 width:100%;min-width:0;min-height:37px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:calc(13px * var(--text-scale));padding:7px}
.flyer-file-label input{font-size:calc(12px * var(--text-scale));max-width:100%;margin-top:5px}
.flyer-import-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.flyer-import-actions button{min-height:38px;font-size:calc(12px * var(--text-scale))}
.flyer-error{color:#ad2b2b;font-weight:650}
.flyer-notice{color:var(--ink)}
.flyer-review{border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
.flyer-review h4{font-size:calc(14px * var(--text-scale));margin:0 0 6px}
.flyer-review-head{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}
.flyer-review-head button{border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--paper);color:var(--ink);cursor:pointer}
.flyer-review-row{display:grid;grid-template-columns:minmax(60px,.6fr) minmax(130px,2fr) minmax(90px,1fr) minmax(95px,1fr);gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px;margin:8px 0;background:var(--paper)}
.flyer-check{display:flex;gap:6px;align-items:center;font-size:calc(11px * var(--text-scale));cursor:pointer}
.flyer-review-row input[type=checkbox]{width:17px;height:17px}
.flyer-raw pre{max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:11px}
.flyer-raw summary{font-size:calc(11px * var(--text-scale));cursor:pointer}
.flyer-saved{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px}
.flyer-item-results{margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:7px}
.flyer-item-results>strong{display:block;color:var(--ink);font-size:calc(11px * var(--text-scale));margin:3px}
.flyer-item-hit{display:grid;grid-template-columns:1fr auto;gap:3px 7px;padding:7px;border-radius:8px;border:1px solid #a6c9a0;background:#edf6e9;color:#233a28;margin:4px 0}
.flyer-item-hit>span{min-width:0;overflow-wrap:anywhere}
.flyer-item-hit small{display:block;font-size:calc(10px * var(--text-scale))}
.flyer-item-hit>strong{white-space:nowrap}
.flyer-item-hit>small{grid-column:1/-1}
@media(max-width:600px){.flyer-review-row{grid-template-columns:75px minmax(0,1fr)}.flyer-review-row label:nth-child(2){grid-column:2}.flyer-review-row label:nth-child(3){grid-column:1}.flyer-review-row label:nth-child(4){grid-column:2}}

.flyer-start-page{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:calc(11px * var(--text-scale));font-weight:650}
.flyer-start-page input{max-width:85px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--paper);color:var(--ink)}

/* Flyer OCR verification is a page-based searchable reading view, never a raw text wall. */
.flyer-raw{margin:14px 0;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--paper)}
.flyer-raw>summary{font-weight:750;cursor:pointer;line-height:1.45}
.flyer-raw-description{margin:8px 0;font-size:calc(11px * var(--text-scale));color:var(--muted)}
.flyer-raw-controls{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin:10px 0}
.flyer-raw-controls label{display:flex;flex-direction:column;gap:4px;font-size:calc(11px * var(--text-scale));font-weight:650;flex:1;min-width:175px}
.flyer-raw-controls input[type=search]{width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface,#fff);color:var(--ink);padding:7px;font-size:calc(13px * var(--text-scale))}
.flyer-raw-controls .flyer-raw-filter{flex-direction:row;gap:6px;align-items:center;min-width:150px}
.flyer-raw-filter input{width:16px;height:16px}
.flyer-raw-count{font-size:calc(11px * var(--text-scale));font-weight:650;margin:8px 0}
.flyer-text-page{margin:10px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface,#fff)}
.flyer-text-page h5{display:flex;align-items:center;gap:9px;font-size:calc(12px * var(--text-scale));margin:0;padding:9px 10px;border-bottom:1px solid var(--line)}
.flyer-text-page h5 small{color:var(--muted);font-weight:400}
.flyer-text-page ol{padding:0;margin:0;list-style:none;max-height:440px;overflow-y:auto}
.flyer-text-page li{overflow-wrap:anywhere;padding:7px 10px;border-bottom:1px solid var(--line);line-height:1.45;font-size:calc(11px * var(--text-scale))}
.flyer-text-page li:last-child{border-bottom:0}
.flyer-text-page>small,.flyer-text-page>.flyer-text-empty{display:block;margin:7px 10px;color:var(--muted);font-size:calc(10px * var(--text-scale))}
.flyer-text-price{font-weight:800;color:var(--ink);white-space:nowrap}
.flyer-source-line{grid-column:1/-1;font-size:calc(10px * var(--text-scale));color:var(--muted);line-height:1.4;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:6px}

/* The ordinary shopper gets automatic matches; manual importing is a fallback. */
.flyer-optional-import{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.flyer-optional-import>summary{font-size:calc(12px * var(--text-scale));font-weight:650;cursor:pointer;color:var(--ink)}
.flyer-item-hit>small{line-height:1.4}

.offer-de-feed-status{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 13px}
.offer-de-feed-status small{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 8px;max-width:100%;font-size:calc(10px * var(--text-scale));color:var(--ink);line-height:1.4}

/* Private PDF review candidates: offer-like layout without implying price verification. */
.german-draft-matches{border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0;overflow:hidden}
.german-draft-matches>summary{cursor:pointer;padding:12px;font-size:calc(12px * var(--text-scale));font-weight:650;line-height:1.5}
.german-draft-list{display:grid;gap:10px;min-width:0}
.german-draft-matches>.german-draft-list{padding:0 8px 10px}
.german-draft-disclaimer{font-size:calc(11px * var(--text-scale));line-height:1.55;color:var(--ink);opacity:.82}
.german-draft-card{--draft-shop:#8d906e;display:grid;gap:9px;padding:12px;min-width:0;border:1px solid var(--line);border-left:3px solid var(--draft-shop);border-radius:10px;background:var(--paper);color:var(--ink);overflow-wrap:anywhere}
.german-draft-card.aldi-nord{--draft-shop:#4082b5}
.german-draft-card.rewe{--draft-shop:#c94b49}
.german-draft-card.penny{--draft-shop:#d39a31}
.german-draft-card.is-unreadable{border-left-style:dashed}
.german-draft-head{display:flex;align-items:start;justify-content:space-between;gap:6px;min-width:0}
.german-draft-shop{font-size:calc(11px * var(--text-scale));font-weight:650;line-height:1.45;min-width:0}
.german-draft-status{border:1px solid #d1c28b;border-radius:20px;background:#f5edce;color:#695824;font-size:calc(10px * var(--text-scale));font-weight:650;line-height:1.3;white-space:nowrap;padding:3px 7px;flex-shrink:0}
.german-draft-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.german-draft-info{display:grid;gap:5px;min-width:0}
.german-draft-name{font-size:calc(14px * var(--text-scale));font-weight:680;line-height:1.35;letter-spacing:-.01em}
.german-draft-size{font-size:calc(12px * var(--text-scale));line-height:1.5;opacity:.85}
.german-draft-money{display:grid;justify-items:end;gap:3px;max-width:105px;text-align:right;font-variant-numeric:tabular-nums}
.german-draft-money small{font-size:calc(10px * var(--text-scale));line-height:1.35;opacity:.77}
.german-draft-money strong{font-size:calc(19px * var(--text-scale));white-space:nowrap;line-height:1.2}
.german-draft-money>span{font-size:calc(11px * var(--text-scale));font-weight:600;line-height:1.45;opacity:.75}
.german-draft-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;font-size:calc(11px * var(--text-scale));line-height:1.5}
.german-draft-foot>span{opacity:.85}
.german-draft-foot a,.german-draft-foot button{font-size:inherit!important;min-height:0!important;padding:2px 0!important;border:0!important;background:transparent!important;color:inherit;text-decoration:underline;text-underline-offset:2px}
.german-draft-notes{font-size:calc(11px * var(--text-scale));border-top:1px solid var(--line);padding-top:7px}
.german-draft-notes>summary{cursor:pointer;font-weight:550;line-height:1.5;opacity:.9}
.german-draft-notes ul{margin:7px 0 0;padding-left:18px;line-height:1.55}
.german-draft-count{font-weight:650}
.german-draft-catalogue .german-admin-body{gap:12px}
.german-draft-more{justify-self:start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:calc(12px * var(--text-scale));font-weight:600;background:var(--paper);color:var(--ink);min-height:38px}
.tile .german-draft-main{grid-template-columns:minmax(0,1fr)}
.tile .german-draft-money{max-width:none;justify-items:start;text-align:left}
.tile .german-draft-card{padding:9px;gap:7px}
.tile .german-draft-name{font-size:calc(13px * var(--text-scale))}
@media(max-width:700px){.german-draft-main{grid-template-columns:minmax(0,1fr)}.german-draft-money{justify-items:start;text-align:left;max-width:none}.german-draft-card{padding:10px}}
@media(prefers-color-scheme:dark){
 .german-draft-matches,.german-draft-card{background:#21382b;color:#edf3e9;border-color:#45614d}
 .german-draft-status{background:#5f4d27;color:#f8e9ae;border-color:#998150}
 .german-draft-foot,.german-draft-notes{border-color:#45614d}
 .german-draft-more{background:#24392c;color:#edf3e9;border-color:#50634e}
}


/* Direct, per-retailer PDF shortcuts shown to all signed-in Kiel accounts. */
.german-direct-flyers{display:grid;gap:8px;min-width:0;margin:10px 0 12px;padding:12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.german-direct-flyers>strong{font-size:calc(13px * var(--text-scale));font-weight:650}
.german-direct-flyer-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.german-flyer-link{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:54px;min-width:0;gap:5px;padding:9px;border:1px solid var(--line);border-radius:9px;text-decoration:none;background:var(--paper);color:var(--ink);font-size:calc(12px * var(--text-scale));font-weight:650;overflow-wrap:anywhere}
.german-flyer-link.is-pdf{border-color:#96ae8e;background:#ebf2e5}
.german-flyer-link small{font-size:calc(10px * var(--text-scale));font-weight:450;line-height:1.4}
.german-direct-flyers>small{font-size:calc(10px * var(--text-scale));line-height:1.55;opacity:.8}
.tile .german-direct-flyer-links{grid-template-columns:minmax(0,1fr)}
@media(max-width:700px){.german-direct-flyer-links{grid-template-columns:minmax(0,1fr)}.german-flyer-link{min-height:45px;gap:3px}}
@media(prefers-color-scheme:dark){.german-direct-flyers,.german-flyer-link{background:#21382b;color:#edf3e9;border-color:#45614d}.german-flyer-link.is-pdf{background:#2e4836;border-color:#668567}}

/* Mobile basket: an expanded offer is not a third-column product tile.
 * Give the expanded item a complete row, rather than forcing OCR text into
 * a 70px wide card and letting letters stack vertically. */
@media (max-width: 850px) {
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) {
  grid-column:1 / -1;
  width:100%;
  min-width:0;
  align-self:start;
  transform:none;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .tile-hit {
  display:grid;
  grid-template-columns:42px minmax(0,1fr);
  grid-template-rows:auto auto;
  column-gap:12px;
  row-gap:3px;
  align-items:center;
  text-align:left;
  width:100%;
  height:auto;
  min-height:76px;
  padding:12px 44px 8px 13px;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .tile-hit>svg {
  grid-column:1;
  grid-row:1 / span 2;
  width:38px;
  height:38px;
  margin:0;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .tile-hit>b {
  grid-column:2;
  grid-row:1;
  margin:0;
  min-width:0;
  font-size:calc(14px * var(--text-scale));
  text-align:left;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .tile-hit>small {
  grid-column:2;
  grid-row:2;
  min-width:0;
  margin:0;
  font-size:calc(11px * var(--text-scale));
  line-height:1.4;
  text-align:left;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .tile-hit>small span {display:inline;line-height:1.4}
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .offer-in-tile {
  width:100%;
  min-width:0;
  padding:0 12px 12px;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-item-offers {
  width:100%;
  min-width:0;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-draft-list {
  min-width:0;
  width:100%;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-draft-head {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-draft-main {
  grid-template-columns:minmax(0,1fr) auto;
  align-items:start;
  gap:10px;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-draft-money {
  justify-items:end;
  text-align:right;
  max-width:112px;
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-direct-flyer-links {
  grid-template-columns:repeat(3,minmax(0,1fr));
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-flyer-link {
  font-size:calc(11px * var(--text-scale));
  min-height:50px;
  padding:8px;
 }
}
@media (max-width: 400px) {
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-draft-main {
  grid-template-columns:minmax(0,1fr);
 }
 .tile-grid>.tile.with-offer-check:has(.german-item-offers) .german-draft-money {
  justify-items:start;
  text-align:left;
  max-width:none;
 }
}
.german-draft-description {
 min-width:0;
 font-size:calc(11px * var(--text-scale));
 line-height:1.55;
 border-top:1px solid var(--line);
 padding-top:6px;
}
.german-draft-description>summary {
 cursor:pointer;
 font-weight:600;
 text-decoration:underline;
 text-underline-offset:2px;
}
.german-draft-description>p {
 margin:7px 0 2px;
 white-space:normal;
 overflow-wrap:break-word;
 word-break:normal;
}
.german-draft-card .german-draft-shop,
.german-draft-card .german-draft-name {
 word-break:normal;
 overflow-wrap:break-word;
 hyphens:auto;
}
.german-draft-card .german-draft-head,
.german-draft-card .german-draft-info {
 min-width:0;
}
.german-draft-card .german-draft-name{
 display:-webkit-box;
 -webkit-box-orient:vertical;
 -webkit-line-clamp:3;
 line-clamp:3;

.german-draft-card .german-draft-status{max-width:50%;text-align:center}
.german-draft-card .german-draft-foot{min-width:0}

/* Offers live outside the product grid. Shared tokens prevent mixed light/dark cards. */
.german-offer-dialog{--ink:#243d31;--muted:#52665a;--paper:#f7f8f4;--line:#dce3d9;color:var(--ink);background:var(--paper);color-scheme:light;border:0;border-radius:22px;padding:0;width:min(640px,calc(100% - 32px));max-width:none;max-height:88vh;max-height:88dvh;box-shadow:0 24px 80px #10251b40;overflow:hidden}
.german-offer-dialog::backdrop{background:#10241b80;backdrop-filter:blur(3px)}
.german-offer-sheet{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh}
.german-offer-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px 18px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--paper)}
.german-offer-dialog-head>div{min-width:0}.german-offer-dialog-head span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:calc(12px * var(--text-scale));font-weight:600;margin-bottom:7px}
.german-offer-dialog-head h2{font-size:calc(25px * var(--text-scale));line-height:1.2;overflow-wrap:break-word}
.german-offer-close{display:grid;place-items:center;flex-shrink:0;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink)}
.german-offer-dialog-body{padding:20px 24px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;min-height:0;scrollbar-gutter:stable}
.german-offer-dialog .german-draft-matches{background:transparent;border:0;overflow:visible;color:var(--ink)}
.german-draft-section-title{font-size:calc(14px * var(--text-scale));font-weight:650;letter-spacing:0;margin:0 0 6px}
.german-offer-dialog .german-draft-matches>.german-draft-list{padding:0;gap:12px}
.german-offer-dialog .german-draft-disclaimer{color:var(--muted);opacity:1;font-size:calc(12px * var(--text-scale));line-height:1.5;margin:0 0 2px}
.german-offer-dialog .german-draft-card{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--draft-shop);border-radius:14px;padding:16px;gap:12px;overflow-wrap:break-word}
.german-offer-dialog .german-draft-head{align-items:center}.german-offer-dialog .german-draft-shop{font-size:calc(12px * var(--text-scale));font-weight:750;letter-spacing:.025em}
.german-offer-dialog .german-draft-status{font-size:calc(10px * var(--text-scale));padding:4px 8px;border:0;background:#f1e7c9;color:#71591c}
.german-offer-dialog .german-draft-main{grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:16px}
.german-offer-dialog .german-draft-name{font-size:calc(16px * var(--text-scale));line-height:1.4;display:block;overflow:visible;letter-spacing:-.02em;font-weight:650}
.german-offer-dialog .german-draft-size{color:var(--muted);opacity:1;font-size:calc(13px * var(--text-scale))}
.german-offer-dialog .german-draft-money{justify-items:end;text-align:right;max-width:130px;gap:4px}
.german-offer-dialog .german-draft-money strong{font-size:calc(24px * var(--text-scale));letter-spacing:-.04em;line-height:1.25}
.german-offer-dialog .german-draft-money small{font-size:calc(10px * var(--text-scale));color:var(--muted);opacity:1}
.german-draft-conditions{font-size:calc(12px * var(--text-scale));line-height:1.5;font-weight:600}
.german-offer-dialog .german-draft-foot{font-size:calc(12px * var(--text-scale));border-color:var(--line);padding-top:8px;gap:10px}
.german-offer-dialog .german-draft-foot a{min-height:44px!important;display:inline-flex;align-items:center;padding:8px 0!important;text-decoration:none;font-weight:650}
.german-offer-dialog .german-draft-notes{border-color:var(--line);padding-top:4px;color:var(--muted);font-size:calc(12px * var(--text-scale))}
.german-offer-dialog .german-draft-notes summary{min-height:32px;align-content:center}
.german-offer-dialog .german-draft-more{width:100%;min-height:44px;text-align:center;justify-self:stretch;background:var(--paper);color:var(--ink);border-color:var(--line);border-radius:10px}
.german-offer-dialog .german-direct-flyers{margin:24px 0 0;padding:18px 0 0;background:transparent;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;gap:12px}
.german-offer-dialog .german-direct-flyer-links{display:flex;gap:8px;flex-wrap:wrap}
.german-offer-dialog .german-flyer-link{flex:1;min-width:90px;min-height:52px;padding:10px 12px;border-color:var(--line);background:var(--paper);color:var(--ink);border-radius:10px;gap:3px}
.german-offer-dialog .german-flyer-link small{color:var(--muted)}
.german-offer-dialog .central-offer{background:var(--paper);color:var(--ink);border-color:var(--line);border-radius:14px}
.german-offer-dialog .central-offer-identity small{color:var(--muted)}
.german-offer-dialog .central-offer>summary{padding:16px}.german-offer-dialog .central-offer-identity b{font-size:calc(16px * var(--text-scale))}
.german-offer-dialog .central-offer-price{font-size:calc(24px * var(--text-scale))}.german-offer-dialog .central-offer-results{gap:12px}
.german-offer-dialog .central-offer-results>.german-draft-matches{margin-top:12px}
.german-offer-empty{font-size:calc(14px * var(--text-scale));line-height:1.6;color:var(--muted)}
@media(max-width:600px){
 .german-offer-dialog{width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh}
 .german-offer-sheet{max-height:92vh;max-height:92dvh}
 .german-offer-dialog-head{padding:20px 18px 16px}.german-offer-dialog-body{padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
 .german-offer-dialog .german-draft-card{padding:14px}.german-offer-dialog .german-draft-main{gap:12px}
}
@media(max-width:360px){.german-offer-dialog .german-draft-main{grid-template-columns:1fr}.german-offer-dialog .german-draft-money{justify-items:start;text-align:left;max-width:none}}
@media(prefers-color-scheme:dark){
 .german-offer-dialog{--ink:#edf3ec;--muted:#b9cbbd;--paper:#192c23;--line:#3a5143;color-scheme:dark}
 .german-offer-dialog .german-draft-status{background:#514423;color:#f6e3a4}
}

/* Spending insights */
.period-chips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px}
.period-chips button{border:1px solid #dce4d2;background:white;border-radius:999px;padding:8px 15px;font-size:calc(13px * var(--text-scale));font-weight:550;color:var(--ink)}
.period-chips button.active{background:var(--green);border-color:var(--green);color:#f8fbef}
.stats.stats-four{grid-template-columns:repeat(4,1fr)}
.timeline-card{margin-bottom:24px}
.timeline-tip{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:28px;margin:18px 0 8px;font-size:calc(13px * var(--text-scale));color:#6f8160}
.timeline-tip b{font-size:calc(18px * var(--text-scale));font-weight:600;color:var(--ink)}
.timeline-bars{display:flex;align-items:stretch;gap:4px;height:190px}
.timeline-bar{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:0;cursor:pointer}
.timeline-bar>span{flex:1;display:flex;align-items:flex-end;border-bottom:1px solid #e2e8db}
.timeline-bar>span>i{display:block;width:100%;max-width:44px;margin:0 auto;background:#8fae86;border-radius:4px 4px 0 0;transition:background .15s}
.timeline-bar.active>span>i,.timeline-bar:hover>span>i{background:var(--green)}
.timeline-bar>small{height:16px;font-size:calc(10px * var(--text-scale));color:#87957b;white-space:nowrap;overflow:visible;text-align:center}
.spending-layout+.spending-layout{margin-top:24px}
.rank-list{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.rank-row>button,.rank-row.static{display:flex;flex-direction:column;gap:7px;width:100%;text-align:left;padding:9px 8px;border-radius:8px}
.rank-row>button:hover{background:#f4f7ee}
.rank-head{display:flex;justify-content:space-between;gap:12px;font-size:calc(14px * var(--text-scale))}
.rank-head b,.rank-head strong{font-weight:500}
.rank-head b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-bar{display:block;height:7px;background:#eef3e5;border-radius:4px;overflow:hidden}
.rank-bar>i{display:block;height:100%;background:var(--green);border-radius:4px}
.rank-row small{display:flex;align-items:center;gap:4px;color:#87957b}
.rank-row.open small svg{transform:rotate(180deg)}
.rank-detail{list-style:none;margin:0 8px 8px;padding:8px 0 0;border-top:1px dashed #e2e8db}
.rank-detail li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:calc(13px * var(--text-scale));color:#4d6150}
.rank-detail b{font-weight:500}
.index-list{display:flex;flex-direction:column;gap:10px;margin:22px 0 18px}
.index-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:12px 14px;border:1px solid #e6eddc;border-radius:10px}
.index-row b{font-weight:550}
.index-row>span{font-weight:600;font-size:calc(13px * var(--text-scale))}
.index-row>small{grid-column:2/4;color:#87957b}
.cheaper{color:#1f6b3d}
.pricier{color:#a4452c}
.compare-list{display:flex;flex-direction:column}
.compare-row{display:flex;flex-direction:column;gap:5px;padding:11px 0;border-top:1px solid #eef3e5}
.compare-row b{font-weight:550;font-size:calc(14px * var(--text-scale))}
.compare-row>span{display:flex;flex-wrap:wrap;gap:6px}
.compare-row em{display:inline-block;font-size:calc(12px * var(--text-scale));padding:3px 8px;border-radius:6px;background:#f2f5ec;color:#4d6150}
.compare-row em.best{background:#dcebd6;color:#1f5a35;font-weight:600}
.compare-row small{color:#87957b}
.compare-more{margin-top:10px;width:100%}
.muted-note{color:#87957b;font-size:calc(13px * var(--text-scale));margin-top:18px}
.price-moves{margin-top:24px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}
.moves h3{display:flex;align-items:center;gap:7px;font-size:calc(14px * var(--text-scale));margin-bottom:6px}
.move-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eef3e5}
.move-row>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.move-row>span:last-child{text-align:right;font-weight:600;flex-shrink:0}
.move-row small{color:#87957b;font-weight:400}
.offer-uncovered{color:#9aa88e}
@media(max-width:1000px){.stats.stats-four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.moves{grid-template-columns:1fr}.timeline-bars{height:150px;gap:2px}.period-chips button{padding:7px 12px}}

/* Offers on/off */
.offers-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;padding:10px 14px;border:1px solid var(--line,#d6ddcf);border-radius:11px;background:#fff}
.offers-switch>span{display:flex;flex-direction:column;gap:2px;font-weight:550;font-size:calc(14px * var(--text-scale))}
.offers-switch small{font-weight:400;color:#87957b}
.offers-switch button{position:relative;width:46px;height:26px;border-radius:999px;background:#d5dccb;flex-shrink:0;transition:background .15s}
.offers-switch button i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.offers-switch button.on{background:var(--green)}
.offers-switch button.on i{transform:translateX(20px)}
.offers-switch+.offer-settings{margin-top:0}
/* Receipt review: unrecognized category */
.review-line.needs-category .line-category{border-color:#d9962f;background:#fffaf0;outline:1px solid #d9962f}
.category-hint{color:#9a6418;font-weight:550}
.set-all-category{flex-direction:row;align-items:center;justify-content:flex-end;gap:10px;margin:6px 0 4px;color:#6f8160}
.set-all-category select{font-size:calc(13px * var(--text-scale));padding:8px 10px}
.recipe-card{display:flex;flex-direction:column;gap:8px;color:var(--green)}
.recipe-card h3{color:var(--ink)}
.recipe-card p{color:var(--muted);font-size:calc(13px * var(--text-scale))}
.recipe-detail{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.recipe-detail ul,.recipe-detail ol{margin:0 0 8px;padding-left:22px;line-height:1.8}
.recipe-import{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.recipe-import>label{display:flex}
.recipe-import summary{cursor:pointer;font-weight:550;font-size:calc(13px * var(--text-scale))}
.recipe-import>*+*{margin-top:12px}
.recipe-import>button{align-self:flex-start}
.recipe-checklist{display:flex;flex-direction:column;gap:4px;max-height:45vh;overflow:auto}
.recipe-check{flex-direction:row;align-items:center;gap:10px;font-weight:400;padding:8px 4px;border-bottom:1px solid var(--line)}
.recipe-check input{width:18px;height:18px;flex-shrink:0}
.recipe-check .at-home{text-decoration:line-through;color:var(--muted)}
.recipe-check small{margin-left:auto;color:var(--muted)}
